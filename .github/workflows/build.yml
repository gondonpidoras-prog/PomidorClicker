
name: Build Pomidor Clicker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PomidorClickerAndroid_cloud_build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -o PomidorClickerAndroid_cloud_build.zip

      - name: Build APK
        run: gradle -p PomidorClickerAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PomidorClicker-APK
          path: PomidorClickerAndroid/app/build/outputs/apk/debug/app-debug.apk
          
